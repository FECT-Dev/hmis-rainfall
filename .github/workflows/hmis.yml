name: HMIS rainfall daily

on:
  schedule:
    - cron: "30 3 * * *"      # 03:30 UTC = 9:00 AM Sri Lanka
  workflow_dispatch:           # lets you run it by hand

permissions:
  contents: write

concurrency:
  group: hmis-rainfall
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium

      - name: Capture
        run: python capture_hmis.py

      - name: Build CSV
        run: python build_csv.py

      - name: Commit results
        run: |
          git config user.name "hmis-bot"
          git config user.email "hmis-bot@users.noreply.github.com"
          git add hmis_out hmis_rainfall_long.csv
          git diff --cached --quiet || (git commit -m "HMIS rainfall $(TZ=Asia/Colombo date +'%Y-%m-%d %H:%M')" && git push)
